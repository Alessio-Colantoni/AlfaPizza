name: AlfaPizza Automations

on:
  schedule:
    # Mezzanotte italiana cade alle 22:00 o alle 23:00 UTC in base all'ora legale.
    - cron: '0 22,23 * * 0'
  workflow_dispatch:

jobs:
  rotate-week:
    runs-on: ubuntu-latest
    steps:
      - name: Rotate week at midnight in Europe/Rome
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"

          ITALY_HOUR=$(TZ="Europe/Rome" date +%H)
          ITALY_DAY=$(TZ="Europe/Rome" date +%u)

          if [ "$ITALY_DAY" -eq 1 ] && [ "$ITALY_HOUR" -eq 0 ]; then
            curl --fail-with-body --silent --show-error --retry 3 \
              -H "x-cron-secret: $CRON_SECRET" \
              "https://alfaserver-newa.onrender.com/api/cron/rotate-week"
          else
            echo "Nessuna rotazione: in Europe/Rome non è lunedì a mezzanotte."
          fi
